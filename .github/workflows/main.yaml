name: AI DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install Python dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Validate Flask installation
      - name: Run Validation Test
        run: |
          python -c "import flask"
          echo "Flask validation successful"

      # 5. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ai-devops-demo .

      # 6. Run Docker container
      - name: Run Container
        run: |
          docker run -d -p 5000:5000 --name ai-devops-container ai-devops-demo
      # 7. Verify container is running
      - name: Verify Container
        run: |
          docker ps
          docker logs ai-devops-container

      # 8. Run Trivy vulnerability scanner
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ai-devops-demo'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'